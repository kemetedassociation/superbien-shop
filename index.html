<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/media/img/logo.webp" />
    <!-- Starts the hero video download while the JS bundle is still being
         fetched/parsed, instead of waiting for React to mount the <video>. -->

    <link rel="preload" as="video" type="video/mp4" href="/media/video/hero.mp4" fetchpriority="high" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SUPERBIEN — Prêt-à-porter homme à Besançon</title>
    <meta name="description" content="SUPERBIEN, boutique de prêt-à-porter homme haut de gamme au 93 Grande Rue à Besançon : Norse Projects, Les Deux, Homecore, Universal Works, Paraboot, Autry. Ouvert du mardi au samedi." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
